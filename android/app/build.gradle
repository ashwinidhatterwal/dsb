plugins { id 'com.android.application' }

android {
    namespace 'in.suhagbhandar.app'
    compileSdk 36
    defaultConfig {
        // Provisional until the owner approves the permanent Play Store identity.
        applicationId 'in.suhagbhandar.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-preview'
            resValue 'string', 'app_name', 'Suhag Bhandar Test'
        }
        release {
            // Intentionally unsigned. A production key is an owner decision.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { abortOnError true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.io=ALL-UNNAMED',
                '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}

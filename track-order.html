<body>
<div class="stickybar solid">
  <a class="brandmark" href="index.html"><img class="glyph" src="favicon-96.png" width="48" height="48" decoding="async" alt="Suhag Bhandar"><span class="hide-sm">Suhag Bhandar</span></a>
  <span style="flex:1"></span>
  <button type="button" class="lang-toggle" aria-label="हिंदी में देखें">हिं</button>
  <a class="iconbtn" href="index.html" aria-label="Back to shop">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
  </a>
</div>
<main class="track-page">
  <div class="track-shell">
    <a class="track-page-back" href="index.html">← Back to shop</a>
    <header class="track-page-head">
      <p class="hero-kicker">ORDER SUPPORT</p>
      <h1>Track your order securely</h1>
      <p>Enter the Order ID from your confirmation slip and the phone number used at checkout.</p>
    </header>
    <section class="track-lookup-card" aria-labelledby="trackLookupTitle">
      <h2 id="trackLookupTitle" style="margin-top:0">Check order status</h2>
      <form id="trackPageForm" novalidate>
        <div class="track-form-grid">
          <div class="field"><label for="trackOrderId">Order ID</label><input type="text" id="trackOrderId" placeholder="Order ID from your order slip" autocomplete="off" maxlength="80" required></div>
          <div class="field"><label for="trackPhone">Phone number</label><input type="tel" id="trackPhone" placeholder="10-digit mobile number" autocomplete="tel" inputmode="tel" maxlength="16" required></div>
        </div>
        <p class="track-error" id="trackError" role="alert" hidden></p>
        <div class="track-form-actions"><button class="primary-btn" id="trackSubmitBtn" type="submit">Check status</button><a class="ghost-btn" href="contact.html">Need help?</a></div>
        <div class="track-security-note"><span>🔒</span><span>Your phone number is sent securely in the request and is not placed in the page URL.</span></div>
      </form>
    </section>
    <section class="track-result-wrap" id="trackResult" aria-live="polite"></section>
  </div>
</main>

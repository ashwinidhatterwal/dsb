name: Build DSB Android app
on:
  workflow_dispatch:
    inputs:
      release:
        description: Build signed production APK and Play Store AAB (main only)
        type: boolean
        default: false
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-app.yml'
      - '.well-known/assetlinks.json'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-app.yml'
      - '.well-known/assetlinks.json'
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Website regression checks
        run: node scripts/run-checks.mjs
      - name: Website certificate merge regression checks
        run: python3 -m unittest discover -s android/scripts -p 'test_*.py'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Override the action default, which includes the retired SDK 'tools' package.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build, test and lint both variants (no production secrets)
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:lintDebug :app:lintRelease --no-daemon
      - name: Explain production download
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Android checks passed. Routine pushes publish test reports only.

          To download an installable production APK, run this workflow manually on main with the production option enabled and all four signing secrets configured. Download dsb-android-production, then publish its public certificate association on the website once. Keep the same signing key for subsequent releases.

          A fresh runner debug APK uses a different certificate and is not verified by the existing website association. It is deliberately not offered as an app download.
          SUMMARY
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsb-android-checks
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Validate secrets and restore private keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing GitHub secrets: ' + ', '.join(missing))
          folder = Path(os.environ['RUNNER_TEMP']) / 'dsb-signing'
          folder.mkdir(mode=0o700)
          path = folder / 'upload.jks'
          data = base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True)
          path.write_bytes(data)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('ANDROID_KEYSTORE_PATH=' + str(path) + '\n')
          PY
      - name: Build signed production APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Verify real release artifacts
        run: python3 android/scripts/verify-release.py
      - name: Upload signed production files and public certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsb-android-production
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/
            android/app/build/release-verification/
          if-no-files-found: error
          retention-days: 14
      - name: Remove private keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/dsb-signing"

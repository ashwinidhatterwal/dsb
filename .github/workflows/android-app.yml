name: Build DSB Android test app
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-app.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-app.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and lint
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug :app:bundleRelease --no-daemon
      - name: Upload test APK and lint report
        uses: actions/upload-artifact@v4
        with:
          name: dsb-android-test
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
      # Debug signing certificates differ between machines. Never publish a
      # cached assetlinks.json blindly after downloading a newly built APK.

name: Update sitemap and deploy shop

on:
  push:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shop-pages-deployment
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last validated catalogue
        uses: actions/cache/restore@v4
        with:
          path: |
            .catalog-build.json
            .catalog-build-meta.json
          key: dsb-catalog-v4-${{ github.run_id }}
          restore-keys: dsb-catalog-v4-
      - name: Generate sitemap from live products
        run: node .github/scripts/generate-sitemap.mjs
      - name: Keep validated catalogue for temporary API outages
        uses: actions/cache/save@v4
        with:
          path: |
            .catalog-build.json
            .catalog-build-meta.json
          key: dsb-catalog-v4-${{ github.run_id }}
      - name: Save updated sitemap
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update product sitemap"
          git push
      - name: Prepare public files
        run: node .github/scripts/prepare-public.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

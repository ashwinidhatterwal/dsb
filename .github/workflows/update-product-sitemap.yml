name: Update product sitemap

on:
  # Refresh once a day. Product links are also discoverable immediately from
  # catalog.html, so a daily sitemap refresh is enough without noisy rebuilds.
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-sitemap-update
  cancel-in-progress: true

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sitemap from live products
        run: node .github/scripts/generate-sitemap.mjs

      - name: Commit only when sitemap changed
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "No sitemap changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update product sitemap"
          git push
